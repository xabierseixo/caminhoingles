      - nome
      - webhook_configurado
    Comarca:
      type: object
      description: |-
        Serializer que permite seleccionar campos dinámicamente.

        Uso desde a API:
            GET /api/concellos/?fields=id,nome,slug
            GET /api/concellos/?omit=descricion,metadata

        Uso no código:
            serializer = MeuSerializer(queryset, fields=['id', 'nome'])
            serializer = MeuSerializer(queryset, omit=['descricion'])

        Exemplo de implementación:
            class ConcelloSerializer(DynamicFieldsSerializer):
                class Meta:
                    model = Concello
                    fields = ['id', 'nome', 'slug', 'codigo_concello', 'lat', 'lng']
      properties:
        nome:
          type: string
          title: Nome da Comarca
          maxLength: 50
        provincia:
          allOf:
          - $ref: '#/components/schemas/Provincia'
          readOnly: true
        slug:
          type: string
          maxLength: 100
          pattern: ^[-a-zA-Z0-9_]+$
        centroid:
          type: string
          readOnly: true
        area_km2:
          type: number
          format: double
          nullable: true
          title: Área (km²)
          description: Superficie en quilómetros cadrados (auto-calculado)
      required:
      - centroid
      - nome
      - provincia
