        explode: false
        style: form
      - in: query
        name: concellos_nome
        schema:
          type: string
        description: Nome dos concellos participantes (búsqueda parcial)
      - in: query
        name: data_fin_max
        schema:
          type: string
          format: date
      - in: query
        name: data_fin_min
        schema:
          type: string
          format: date
      - in: query
        name: data_inicio_max
        schema:
          type: string
          format: date
      - in: query
        name: data_inicio_min
