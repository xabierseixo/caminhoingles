# Copia local do schema OpenAPI da API GALIZA para consulta e referencia
# Fonte: GALIZA API (1.0) (1).yaml

openapi: 3.0.3
info:
  title: GALIZA API
  version: 1.0.0 (1.0)
  description: "\n## API REST do Patrimonio Cultural de Galicia\n\n### Recursos\n\
    - **Patrimonio Material**: Monumentos, edificios, igrexas\n- **Patrimonio Inmaterial**:\
    \ Tradicións, festas, lendas\n- **Eventos**: Concertos, festivais, exposicións\n\
    - **Espazos**: Museos, bibliotecas, restaurantes\n- **Obras**: Libros, cancións,\
    \ esculturas\n- **Xeografía**: Provincias, Comarcas, Concellos, Parroquias\n\n\
    ### Autenticación\nTodos os endpoints requiren token:\n```\nAuthorization: Token\
    \ <o_teu_token>\n```\n\n### Paxinación\nResultados paxinados a 100 elementos.\
    \ Usa `?page=N` para navegar.\n    "
  contact:
    name: GALIZA API
    url: https://gl313.com
paths:
  /api/entidades/empresas/:
    get:
      operationId: entidades_empresas_list
      description: 'Listado de empresas. Filtros: concello_codigo, categoria, etiqueta,
        tipo_empresa, search'
      summary: Listar empresas
      parameters:
      - in: query
        name: actividade
        schema:
          type: string
        description: Actividade da empresa
      - in: query
        name: categoria
        schema:
          type: array
          items:
            type: string
        description: 'Slug da categoría. Acepta múltiples valores separados por coma.
          Exemplo: ?categoria=artistas,escritores'
        explode: false
        style: form
      - in: query
        name: concello
        schema:
          type: array
          items:
            type: string
        description: 'Slug do concello. Acepta múltiples valores separados por coma.
          Ex: ?concello=bergondo,sada'
        explode: false
        style: form
      - in: query
        name: concello_codigo
        schema:
          type: array
          items:
            type: string
            title: Código IGE
        description: 'Código INE do concello. Acepta múltiples valores separados por
          coma. Ex: ?concello_codigo=15008,15009'
        explode: false
        style: form
      - in: query
        name: etiqueta
        schema:
          type: array
          items:
            type: string
        description: 'Slug da etiqueta. Acepta múltiples valores separados por coma.
          Ex: ?etiqueta=cultura,servizos'
        explode: false
        style: form
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: slug
        schema:
          type: string
      - in: query
        name: tipo_empresa
        schema:
          type: string
        description: Tipo de empresa (autonomo, sl, sa...)
      tags:
      - Entidades
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEmpresaListList'
          description: ''
  /api/entidades/empresas/{slug}/:
    get:
      operationId: entidades_empresas_retrieve
      description: |-
        API REST para empresas con filtros.

        Filtros:
