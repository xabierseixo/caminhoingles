components:
  schemas:
    AccionEnum:
      enum:
      - evento.created
      - evento.updated
      - evento.deleted
      type: string
      description: |-
        * `evento.created` - Evento creado
        * `evento.updated` - Evento actualizado
        * `evento.deleted` - Evento eliminado
    AmbitoTerritorialDetail:
      type: object
      description: Serializer completo para detalles de ámbitos territoriais
      properties:
        id:
          type: integer
          readOnly: true
        slug:
          type: string
          description: Xerado automaticamente desde o nome
          maxLength: 255
          pattern: ^[-a-zA-Z0-9_]+$
        nome:
          type: string
          readOnly: true
        descricion:
          type: string
          readOnly: true
        meta_titulo:
          type: string
          readOnly: true
        meta_descricion:
          type: string
          readOnly: true
        codigo_oficial:
          type: string
          title: Código oficial
          description: 'Código oficial europeo ou estatal (ex: ES1120001 para LIC,
            ES-PGI-0217-0001 para IXP)'
          maxLength: 50
        categoria_principal_nome:
          type: string
          readOnly: true
          nullable: true
        xestionado_por_nome:
          type: string
          readOnly: true
          nullable: true
        xestionado_por_slug:
          type: string
          readOnly: true
          nullable: true
        concellos_list:
          type: string
          readOnly: true
        parroquias_list:
          type: string
          readOnly: true
        parroquias_count:
          type: string
          readOnly: true
        superficie_ha:
          type: number
          format: double
          nullable: true
          title: Superficie (hectáreas)
          description: Superficie total en hectáreas
        data_declaracion:
          type: string
          format: date
          nullable: true
          title: Data de declaración
          description: Data de declaración ou constitución do ámbito
        patrimonio_material_count:
          type: string
          readOnly: true
        patrimonio_inmaterial_count:
          type: string
          readOnly: true
        eventos_count:
          type: string
          readOnly: true
        espazos_count:
          type: string
          readOnly: true
        patrimonio_material_list:
          type: string
          readOnly: true
        patrimonio_inmaterial_list:
          type: string
          readOnly: true
        eventos_list:
          type: string
          readOnly: true
        espazos_list:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
