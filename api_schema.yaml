    Parroquia:
      type: object
      description: |-
        Serializer que permite seleccionar campos dinámicamente.

        Uso desde a API:
            GET /api/concellos/?fields=id,nome,slug
            GET /api/concellos/?omit=descricion,metadata

        Uso no código:
            serializer = MeuSerializer(queryset, fields=['id', 'nome'])
            serializer = MeuSerializer(queryset, omit=['descricion'])

        Exemplo de implementación:
            class ConcelloSerializer(DynamicFieldsSerializer):
                class Meta:
                    model = Concello
                    fields = ['id', 'nome', 'slug', 'codigo_concello', 'lat', 'lng']
      properties:
        nome:
          type: string
          title: Nome da Parroquia
          maxLength: 50
        codigo_parroquia:
          type: string
          nullable: true
          title: Código IGE
          description: 'Código oficial IGE/INE da parroquia (ex: 1500803)'
          maxLength: 10
        slug:
          type: string
          maxLength: 120
          pattern: ^[-a-zA-Z0-9_]+$
        concello_nome:
          type: string
          title: Nome do Concello
          readOnly: true
        centroid:
          type: string
